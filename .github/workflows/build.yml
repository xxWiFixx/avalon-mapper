name: Verified Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm audit --audit-level=high
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run dist -- --publish never
        working-directory: app
      - run: node tools/release-manifest.js
      - name: Dependency inventory
        working-directory: app
        run: npm sbom --sbom-format=cyclonedx | Out-File -Encoding utf8 ../dist/dependencies.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS
            dist/build-info.json
            dist/dependencies.cdx.json
          if-no-files-found: error
          retention-days: 14

  provenance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*-setup.exe
            release/SHA256SUMS
            release/build-info.json
            release/dependencies.cdx.json

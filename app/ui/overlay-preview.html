<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>оверлей — предпросмотр</title>
  <link rel="stylesheet" href="overlay.css">
  <style>
    /* Фон прозрачный: снимок кладётся на настоящий кадр игры в tools/preview-overlay.js */
    html, body { background: transparent; }
    .demo-controls { position: fixed; top: 16px; left: 16px; width: 260px; padding: 12px; color: #ece0c8; background: #17120f; border: 1px solid #6a4a26; border-radius: 6px; }
    .demo-controls button { margin: 4px; padding: 6px 10px; background: #302820; color: inherit; border: 1px solid #6a4a26; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="box" hidden>
    <div class="ov-map"><img id="ovMap" alt=""></div>
    <div class="ov-scroll">
      <span class="sc-tier" id="ovTier"></span>
      <span class="sc-mark" id="ovMark"></span>
      <span class="sc-name" id="ovName"></span>
      <span class="sc-time" id="ovTime"></span>
    </div>
    <div class="ov-panel" id="ovPanel"></div>
  </div>
  <div id="ovGuide" hidden></div>
  <script src="activities.js"></script>
  <script src="zone-maps.js"></script>
  <script>
    const previewEvents = {};
    window.api = { on: (name, fn) => { previewEvents[name] = fn; }, drag() {}, scale() {}, setup() {} };
  </script>
  <script src="overlay.js"></script>
  <script>
    // Данные берём НАСТОЯЩИЕ — тот же zone-data.json, что читает приложение.
    // Так предпросмотр нельзя рассинхронить с боевой формой данных (ровно это уже случалось).
    const q = new URLSearchParams(location.search);
    const zone = q.get('zone') || 'Oiros-Alaiam';
    const capNum = q.has('cap') ? Number(q.get('cap')) : 6;
    const capMax = q.has('size') ? Number(q.get('size')) : 7;      // размер портала: 7 или 20
    const capMaxKnown = q.get('size') !== 'unknown';
    const closes = q.get('uncertain') === '1' ? null : q.has('closes') ? Number(q.get('closes')) : 49230;
    // состояния из настроек: map=0 — без карты зоны, manual=1 — зона выбрана руками,
    // setup=1 — режим «задать место», scale — подпись размера в этом режиме
    const view = {
      showMap: q.get('map') !== '0',
      manual: q.get('manual') === '1',
      setup: q.get('setup') === '1',
      scale: q.has('scale') ? Number(q.get('scale')) : 1,
      custom: q.get('custom') === '1',
      partial: q.get('partial') === '1',
      expired: q.get('expired') === '1',
      notSaved: q.get('notSaved') === '1',
    };
    function renderPreview(payload) {
      window.__overlayShow(payload);
      if (q.get('demo') !== '1') return;
      document.body.style.background = 'radial-gradient(at 80% 75%, #48382f, #20232a)';
      const controls = document.createElement('aside');
      controls.className = 'demo-controls';
      const states = [
        ['Карта', () => window.__overlayShow({ ...payload, partial: true })],
        ['Параметры', () => window.__overlayShow({ ...payload, partial: false })],
        ['Нет зоны', () => window.__overlayShow({ ...payload, partial: false, noOrigin: true,
          originHint: 'Зона не получена из трафика. После перехода повтори хоткей.' })],
        ['Ждём зону', () => window.__overlayShow({ ...payload, partial: false, waiting: true, pendingId: 1 })],
        ['Зона получена', () => previewEvents['overlay-origin']({ pendingId: 1, from: 'Origin' })],
        ['Без карты', () => window.__overlayShow({ ...payload, partial: false, showMap: false })],
      ];
      for (const [label, action] of states) {
        const button = document.createElement('button'); button.textContent = label;
        button.addEventListener('click', action); controls.appendChild(button);
      }
      document.body.appendChild(controls);
    }

    if (q.get('busy')) {
      window.__overlayShow({ busy: true });
    } else
    fetch('../data-static/zone-data.json')
      .then(r => r.json())
      .then(list => {
        const z = list.find(x => x.name === zone);
        if (!z) {                       // зона мира: активностей нет, только имя и портал
          renderPreview(Object.assign({
            tip: { name: zone, color: q.get('color') || 'city', tier: null, capNum, capMax, capMaxKnown, closes, activities: null },
            copied: zone,
          }, view));
          return;
        }
        renderPreview(Object.assign({
          tip: {
            name: z.name, color: 'avalon', tier: z.tier, capNum, capMax, capMaxKnown, closes,
            timerUncertain: q.get('uncertain') === '1',
            activities: z,
          },
        }, view));
      });
  </script>
</body>
</html>

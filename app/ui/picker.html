<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; font-src 'self' file: data:; connect-src 'self' file:">
<title>Выбор области плашки зоны</title>
<style>
  /* Окно во весь экран поверх всего: снимок экрана как фон, поверх — рамка выделения.
     Своё оформление, без общего style.css: страница живёт по своим правилам. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; cursor: crosshair; user-select: none; }
  body { background: #000; font: 400 14px/1.45 'Fira Sans', 'Segoe UI', system-ui, sans-serif; color: #ece0c8; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  /* затемняем всё, кроме выделенного прямоугольника */
  #veil { position: fixed; inset: 0; background: #0b0908cc; }
  #sel {
    position: fixed; display: none;
    border: 1px solid #e0a53c;
    box-shadow: 0 0 0 9999px #0b0908cc;   /* дыра в затемнении ровно по выделению */
  }
  #hint {
    position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
    background: #17120fef; border: 1px solid #c9bda6a6; border-radius: 3px;
    padding: 12px 18px; text-align: center; box-shadow: 0 14px 34px -12px #000;
  }
  #hint b { color: #f6c874; font-weight: 600; }
  #hint .k {
    display: inline-block; font-size: 12px; padding: 2px 7px; margin: 0 2px;
    background: linear-gradient(#3d3937, #262120); border: 1px solid #6a6360;
    border-bottom-width: 2px; border-radius: 4px;
  }
  #size {
    position: fixed; display: none; padding: 3px 8px; font-size: 12px;
    background: #17120fef; border: 1px solid #e0a53c88; border-radius: 3px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
</style>
</head>
<body>
  <img id="shot" alt="">
  <div id="veil"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">
    <b>Обведи плашку с названием зоны</b><br>
    она под миникартой справа внизу: «<b>VI ☠ Oiros-Alaiam 00:56</b>»<br>
    <b>бери заметно шире надписи</b> — у зон с длинными именами плашка растягивается<br>
    <span class="k">Esc</span> — отмена, <span class="k">пробел</span> — вернуть стандартную область
  </div>
  <script src="picker.js"></script>
</body>
</html>

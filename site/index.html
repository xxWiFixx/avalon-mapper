  <noscript><style>#root{display:none}main{max-width:1100px;margin:auto;padding:48px 24px}img{width:100%;margin:32px 0}a{color:#eee}</style><main><nav><a href="./?lang=ru">Русский</a> · <a href="en/">English</a></nav><h1>Твоя карта Дорог Авалона.</h1><p>Порталы, маршруты, общая карта группы и статистика сессии в Albion Online.</p><a href="https://github.com/xxWiFixx/avalon-mapper/releases/latest">Скачать для Windows</a><img src="assets/screens-ai/map-1920.webp" alt="Карта Avalon Mapper"/><h2>Записывай портал по F9</h2><img src="assets/screens-ai/overlay-1920.webp" alt="Оверлей с картой зоны"/><h3>Бесплатно для каждого</h3><p>Записывай без лимита.</p><p>Автоматическая и ручная запись порталов — бесплатно и без дневного лимита.</p><p>Личная карта, маршруты и статистика бесплатны. Время закрытия портала всегда настоящее.</p><h2>Как прошла охота?</h2><img src="assets/screens-ai/statistics-1920.webp" alt="Статистика сессии"/><h2>Исследуй вместе</h2><img src="assets/screens-ai/shared-1920.webp" alt="Общая карта группы"/><h2>Свой сервер для друзей</h2><p>Приложение бесплатно. Владелец группового сервера активирует код на 30 дней; участники подключаются бесплатно.</p><h3>Сервер для группы</h3><p>799 ₽ / 30 дней</p><p>Закрытая карта для друзей или гильдии. Владелец оплачивает свой групповой сервер, остальные присоединяются по приглашению.</p><p>Все участники бесплатно записывают и смотрят порталы без дневного лимита.</p><p>Создание сервера: «+» → название и код активации. Продление: Настройки → Мои сервера или ПКМ по серверу → Мои сервера. Код добавляет 30 дней к оставшемуся сроку.</p></main></noscript>
